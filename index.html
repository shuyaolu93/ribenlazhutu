<html lang="zh-CN">

<title>日本蜡烛图技术 · 形态与案例图谱</title>

<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#FAFAFA;
  --line:#ECECEC; --line2:#E0E0E0;
  --text:#171717; --dim:#7E7E7E; --faint:#B8B8B8;
  --up:#E5484D; --down:#2F9E63;
  --serif:"Noto Serif SC",serif; --sans:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line2)}

/* ---------- 顶部 ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-weight:900;font-size:16px;letter-spacing:.04em}
.logo i{font-style:normal}
.topnav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.tchip{background:transparent;border:none;color:var(--dim);font-size:13.5px;padding:7px 12px;border-radius:8px;border-bottom:2px solid transparent;transition:.15s}
.tchip:hover{color:var(--text);background:var(--surface2)}
.tchip.on{color:var(--text);font-weight:600;border-bottom-color:var(--text)}

/* ---------- hero ---------- */
.hero{max-width:1120px;margin:0 auto;padding:64px 20px 40px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--faint);margin-bottom:16px}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(32px,5.5vw,54px);line-height:1.16;letter-spacing:.01em}
.hero p{margin-top:16px;max-width:640px;color:var(--dim);font-size:15px}
.hero .meta{margin-top:28px;display:flex;flex-wrap:wrap;gap:8px 0}
.hero .meta span{font-size:13px;color:var(--dim);padding-right:26px;margin-right:26px;border-right:1px solid var(--line)}
.hero .meta span:last-child{border-right:none;padding-right:0;margin-right:0}
.hero .meta b{color:var(--text);font-weight:700;font-size:15px}

/* ---------- 章节 ---------- */
.chapter{max-width:1120px;margin:0 auto;padding:40px 20px 6px}
.ch-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px}
.ch-num{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.08em}
.ch-head h2{font-family:var(--serif);font-weight:900;font-size:22px}
.ch-head .en{font-size:12px;color:var(--faint);font-family:var(--mono)}
.ch-head .count{margin-left:auto;font-size:12px;color:var(--faint);font-family:var(--mono)}
.ch-note{font-size:13px;color:var(--faint);margin:0 0 22px;max-width:720px}

/* ---------- 网格 ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;display:flex;flex-direction:column;text-align:left;color:inherit;min-width:0}
.cell:hover{border-color:var(--line2);box-shadow:0 3px 14px rgba(0,0,0,.05);transform:translateY(-1px)}
.cell:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.cell .cv{width:100%;height:84px;display:block;margin-bottom:14px}
.cell .cn{font-family:var(--serif);font-weight:700;font-size:16.5px;line-height:1.35}
.cell .en{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:2px}
.cell .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:11px;padding:2px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);background:var(--surface2)}
.tag.up{color:var(--up);border-color:rgba(229,72,77,.35);background:rgba(229,72,77,.06)}
.tag.down{color:var(--down);border-color:rgba(47,158,99,.35);background:rgba(47,158,99,.06)}
.tag.neu{color:#8A8A8A}
.cell .ds{font-size:12.5px;color:var(--dim);margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- 详情弹层 ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.backdrop{position:absolute;inset:0;background:rgba(24,24,24,.22)}
.panel{position:relative;width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px 30px;box-shadow:0 24px 64px rgba(0,0,0,.10)}
.close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--dim);font-size:20px;display:flex;align-items:center;justify-content:center}
.close:hover{border-color:var(--text);color:var(--text)}
.m-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.m-top .ch{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.08em}
.m-top h2{font-family:var(--serif);font-size:26px;font-weight:900}
.m-top .en{font-size:12px;color:var(--faint);font-family:var(--mono)}
.m-tags{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 6px}
.m-candle{width:100%;height:180px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:14px 0}
.m-candle svg{width:100%;height:100%}
.m-sec{font-size:11px;color:var(--faint);letter-spacing:.14em;margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.m-sec::before{content:"";width:20px;height:1px;background:var(--line2)}
.m-body p{color:var(--dim);font-size:14.5px;margin-bottom:10px}
.m-note{background:var(--surface2);border-radius:10px;padding:14px 16px;font-size:13.5px;color:var(--text)}
.case{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.case .ct{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--faint);margin-bottom:8px}
.case .ct b{color:var(--text);font-weight:600;font-family:var(--mono)}
.case p{color:var(--dim);font-size:14px;margin:0}

footer{border-top:1px solid var(--line);margin-top:52px;padding:32px 20px 56px;text-align:center;color:var(--faint);font-size:12px}
footer b{color:var(--dim);font-weight:500}

@media(min-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1280px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

  {id:'ch07',num:'第七章',name:'持续形态',en:'Continuation Patterns',note:'形态完成后趋势延续：窗口、并列阴阳线、三法、分手线等。'},
  {id:'ch08',num:'第八章',name:'神奇的十字线',en:'The Doji',note:'十字线家族：北方/南方十字线、长腿、墓碑、蜻蜓、大风大浪线与三星形态。'},

  {id:'ch10',num:'第十章',name:'蜡烛图信号的汇聚',en:'Signal Convergence',note:'一群蜡烛图信号汇聚在同一价格区，将放大该区域作为支撑或阻挡的重要性。'},
  {id:'ch11',num:'第十一章',name:'蜡烛图与趋势线',en:'Candlesticks & Trend Lines',note:'趋势线的类型与画法、破低反涨/破高反跌形态、极性转换原则。'},
  {id:'ch12',num:'第十二章',name:'蜡烛图与百分比回撤',en:'Candlesticks & Retracements',note:'38% / 50% / 62% 斐波那契回撤水平，以及回撤位必须得到蜡烛图信号验证。'},

let PATTERNS=[];
/* ---- 第四章 反转形态 ---- */
PATTERNS.push(
{id:'hammer',cn:'锤子线',en:'Hammer',ch:'ch04',sig:'看涨',kind:'反转',

{id:'hanging-man',cn:'上吊线',en:'Hanging Man',ch:'ch04',sig:'看跌',kind:'反转',
