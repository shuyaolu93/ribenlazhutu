<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>日本蜡烛图技术 · 形态与案例图谱</title>

<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E14; --bg2:#0E1220; --surface:#141A26; --surface2:#1A2231;
  --line:#232C3D; --line2:#2E3A52;
  --text:#E7EDF4; --dim:#97A2B3; --faint:#66707F;
  --up:#EF4B52; --up2:#FF7A80; --down:#2FA46A; --down2:#63D09B;
  --amber:#E6B457;
  --serif:"Noto Serif SC",serif; --sans:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
a{color:var(--amber);text-decoration:none}

/* ---------- 顶部 ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(11,14,20,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-weight:900;font-size:17px;letter-spacing:.02em}
.logo i{font-style:normal;color:var(--amber)}
.topnav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tchip{border:1px solid var(--line2);background:transparent;color:var(--dim);font-size:13px;padding:5px 12px;border-radius:999px;transition:.15s}
.tchip:hover{color:var(--text);border-color:var(--amber)}
.tchip.on{background:var(--amber);border-color:var(--amber);color:#1A1303;font-weight:600}

/* ---------- hero ---------- */
.hero{max-width:1180px;margin:0 auto;padding:48px 20px 26px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.26em;color:var(--amber);margin-bottom:14px}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(30px,5vw,52px);line-height:1.12}
.hero p{margin-top:12px;max-width:720px;color:var(--dim);font-size:15px}
.hero .meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:18px;color:var(--faint);font-size:12.5px}
.hero .meta b{color:var(--text);font-weight:600}

/* ---------- 章节 ---------- */
.chapter{max-width:1180px;margin:0 auto;padding:30px 20px 6px}
.ch-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:18px}
.ch-num{font-family:var(--mono);font-size:13px;color:var(--amber);letter-spacing:.1em}
.ch-head h2{font-family:var(--serif);font-weight:700;font-size:22px}
.ch-head .en{font-size:12.5px;color:var(--faint);font-family:var(--mono)}
.ch-note{font-size:13px;color:var(--faint);margin:-8px 0 0;max-width:760px}

/* ---------- 网格 ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;text-align:left;color:inherit;min-width:0}
.cell:hover{border-color:var(--amber);transform:translateY(-2px)}
.cell:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.cell .cv{width:100%;height:86px;display:block;margin-bottom:8px}
.cell .cn{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.3}
.cell .en{font-size:11.5px;color:var(--faint);font-family:var(--mono);margin-top:1px}
.cell .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--dim)}
.tag.up{color:var(--up2);border-color:rgba(239,75,82,.4);background:rgba(239,75,82,.08)}
.tag.down{color:var(--down2);border-color:rgba(47,164,106,.4);background:rgba(47,164,106,.08)}
.tag.neu{color:var(--amber);border-color:rgba(230,180,87,.4);background:rgba(230,180,87,.08)}
.cell .ds{font-size:12.5px;color:var(--dim);margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- 详情弹层 ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.backdrop{position:absolute;inset:0;background:rgba(6,8,12,.74)}
.panel{position:relative;width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:26px 24px}
.close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--dim);font-size:19px;display:flex;align-items:center;justify-content:center}
.close:hover{border-color:var(--amber);color:var(--amber)}
.m-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.m-top .ch{font-family:var(--mono);font-size:12px;color:var(--amber)}
.m-top h2{font-family:var(--serif);font-size:24px;font-weight:900}
.m-top .en{font-size:12.5px;color:var(--faint);font-family:var(--mono)}
.m-tags{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 4px}
.m-candle{width:100%;height:170px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;margin:12px 0}
.m-candle svg{width:100%;height:100%}
.m-sec{font-size:12px;color:var(--faint);letter-spacing:.1em;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.m-sec::before{content:"";width:18px;height:1px;background:var(--line2)}
.m-body p{color:var(--dim);font-size:14.5px;margin-bottom:10px}
.m-note{background:var(--surface);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:12px 14px;font-size:13.5px;color:var(--text)}
.case{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.case .ct{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--faint);margin-bottom:6px}
.case .ct b{color:var(--amber);font-weight:600;font-family:var(--mono)}
.case p{color:var(--dim);font-size:14px;margin:0}

footer{border-top:1px solid var(--line);margin-top:40px;padding:28px 20px 50px;text-align:center;color:var(--faint);font-size:12.5px}
footer b{color:var(--dim);font-weight:500}

@media(min-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1280px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

  <h1>日本蜡烛图技术<br>形态与案例图谱</h1>

  {id:'ch05',num:'第五章',name:'星线',en:'Star Patterns',note:'以“星线”（小实体+与前实体跳空）为共同特征的反转形态。'},

  {id:'ch08',num:'第八章',name:'神奇的十字线',en:'The Doji',note:'十字线家族：北方/南方十字线、长腿、墓碑、蜻蜓、大风大浪线与三星形态。'}

/* ---- 第四章 反转形态 ---- */
PATTERNS.push(
{id:'hammer',cn:'锤子线',en:'Hammer',ch:'ch04',sig:'看涨',kind:'反转',
 desc:'伞形线之一。长下影、小实体、实体位于区间顶端；出现在下降趋势末端，是底部反转信号。',
 def:'伞形线具有长下影线、实体较小（黑白均可）且实体接近全天价格区间的顶端。它出现在下降趋势中即称为锤子线，意为“市场正用锤子夯实底部”，是下降趋势即将结束的信号；实体为白色时看涨意义更坚挺（日本人称“力量线”）。',

 candle:[[55,68,5,58]]},
{id:'bullish-engulf',cn:'看涨吞没',en:'Bullish Engulfing（抱线）',ch:'ch04',sig:'看涨',kind:'反转',
 desc:'后一根阳线实体完全吞没前一根阴线实体，多方强势反攻，最可靠的底部反转信号之一。',
 def:'吞没形态（抱线形态）由两根蜡烛线组成：前一根小实体、后一根长实体，且后实体完全覆盖前实体、颜色相反。看涨吞没发生在下降趋势中，第一根为黑色小实体（显示空方失去立足地），第二根为长白色实体，说明多头已从空头手中夺得控制权；白色实体越长、吞没范围越大（甚至吞没多根）信号越强。',

 candle:[[45,55,42,50],[40,82,36,78]]},
{id:'bearish-engulf',cn:'看跌吞没',en:'Bearish Engulfing（抱线）',ch:'ch04',sig:'看跌',kind:'反转',

 candle:[[58,62,40,44],[68,92,62,74]]},
{id:'dark-cloud',cn:'乌云盖顶',en:'Dark Cloud Cover',ch:'ch04',sig:'看跌',kind:'反转',

 candle:[[44,48,20,24],[62,84,50,70]]},
{id:'piercing',cn:'刺透形态',en:'Piercing Pattern（斩回线）',ch:'ch04',sig:'看涨',kind:'反转',

 case:{t:'戴顿-赫德森（Dayton-Hudson）',f:'日蜡烛线图',d:'9月7日—8日',c:'9 月 8 日开市于 54 美元上下、一度跌穿此前支撑，但当日收市大幅回升，与前一日组成刺透形态；一周后 9 月 16 日形成锤子线，再次确认约 54 美元的支撑水平。'},
 candle:[[55,58,30,34],[38,72,34,66]]}
);
/* ---- 第五章 星线 ---- */
PATTERNS.push(

/* ---- 蜡烛渲染 ---- */
function candleSVG(arr){
  const W=150,H=100,P=9;
  let lo=Infinity,hi=-Infinity;
  arr.forEach(c=>{lo=Math.min(lo,c[2]);hi=Math.max(hi,c[1]);});
  const span=(hi-lo)||1,n=arr.length,step=(W-2*P)/n,bw=Math.max(7,step*0.58);
  const y=v=>P+(H-2*P)*(hi-v)/span;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-hidden="true">`;
  arr.forEach((c,i)=>{
    const x=P+i*step+step/2,up=c[3]>=c[0],col=up?UP:DOWN;
    const oy=y(c[0]),cy=y(c[3]),bt=Math.min(oy,cy),bb=Math.max(oy,cy),bh=Math.max(bb-bt,1.6);
    s+=`<line x1="${x}" y1="${y(c[1])}" x2="${x}" y2="${y(c[2])}" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;
    s+=`<rect x="${x-bw/2}" y="${bt}" width="${bw}" height="${bh}" fill="${col}"/>`;
    if(bh<=2.2){s+=`<line x1="${x-bw/2}" y1="${bt}" x2="${x+bw/2}" y2="${bt}" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;}
  });
  return s+'</svg>';
}

/* ---- 渲染 ---- */
function build(){
  document.getElementById('mTotal').textContent=PATTERNS.length;
  const main=document.getElementById('main');
  main.innerHTML=CHAPTERS.map(ch=>{
    const list=PATTERNS.filter(p=>p.ch===ch.id);
    if(!list.length)return '';
    return `<section class="chapter" id="${ch.id}">
      <div class="ch-head"><span class="ch-num">${ch.num}</span><h2>${ch.name}</h2><span class="en">${ch.en}</span></div>
      <p class="ch-note">${ch.note}</p>
      <div class="grid" style="margin-top:16px">${list.map(cardHTML).join('')}</div>
    </section>`;
  }).join('');
}
function cardHTML(p){
  const s=p.sig==='看涨'?'up':(p.sig==='看跌'?'down':'neu');
  return `<button class="cell" data-id="${p.id}" aria-label="查看 ${p.cn} 详情">
    <span class="cv">${candleSVG(p.candle)}</span>
    <span class="cn">${p.cn}</span>
    <span class="en">${p.en}</span>
    <span class="tags"><span class="tag ${s}">${p.sig}</span><span class="tag">${p.kind}</span></span>
    <span class="ds">${p.desc}</span>
  </button>`;
}
function tagHTML(p){
  const s=p.sig==='看涨'?'up':(p.sig==='看跌'?'down':'neu');
  return `<span class="tag ${s}">${p.sig}</span><span class="tag">${p.kind}</span><span class="tag">${p.ch.replace('ch','第').replace('04','四章').replace('05','五章').replace('06','六章').replace('07','七章').replace('08','八章')}</span>`;
}
function openModal(id){
  const p=PATTERNS.find(x=>x.id===id); if(!p)return;
  const ch=CHAPTERS.find(c=>c.id===p.ch);
  document.getElementById('mCh').textContent=(ch?ch.num+' '+ch.name:'');
  document.getElementById('mTitle').textContent=p.cn;
  document.getElementById('mEn').textContent=p.en;
  document.getElementById('mTags').innerHTML=tagHTML(p);
  document.getElementById('mCandle').innerHTML=candleSVG(p.candle);
  document.getElementById('mBody').innerHTML=`<p>${p.def}</p>`;
  document.getElementById('mNote').textContent=p.note;
  document.getElementById('mCase').innerHTML=
    `<div class="ct"><span>标的：<b>${p.case.t}</b></span><span>周期：<b>${p.case.f}</b></span><span>时间：<b>${p.case.d}</b></span></div><p>${p.case.c}</p>`;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow='';}

/* ---- 事件 ---- */
document.querySelectorAll('.tchip').forEach(b=>{
  b.addEventListener('click',()=>{
    const el=document.getElementById(b.dataset.goto);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  });
});
document.getElementById('main').addEventListener('click',e=>{
  const cell=e.target.closest('.cell'); if(cell)openModal(cell.dataset.id);
});
document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',closeModal));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
build();
</script>
